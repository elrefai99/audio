name: Check Docker Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Docker build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker build
        env:
          IMAGE_TAG: srvj-backend:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_TAG" .

      - name: Docker build summary
        if: always()
        env:
          IMAGE_TAG: srvj-backend:${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          echo "## Docker Build Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`srvj-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Docker image built successfully' || '❌ Docker build failed' }}" >> $GITHUB_STEP_SUMMARY
