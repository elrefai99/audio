name: Test Build TypeScript Project

on:
  push:
    branches: 
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Install dependencies & devDependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm build

  docker:
    needs: build
    uses: ./.github/workflows/deploy.aws.ecs.yml

  notify:
    needs: docker
    uses: ./.github/workflows/notify.discord.yml
    secrets: inherit
